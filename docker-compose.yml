services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: helphero
      POSTGRES_USER: helphero
      POSTGRES_PASSWORD: helphero
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://helphero:helphero@postgres:5432/helphero
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
