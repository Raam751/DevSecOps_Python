apiVersion: apps/v1
kind: Deployment
metadata:
  name: helphero-backend
  namespace: helphero
  labels:
    app: helphero-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helphero-backend
  template:
    metadata:
      labels:
        app: helphero-backend
    spec:
      containers:
        - name: backend
          image: ramtichkule/helphero-backend:__IMAGE_TAG__
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "sqlite:///./helphero.db"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helphero-frontend
  namespace: helphero
  labels:
    app: helphero-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helphero-frontend
  template:
    metadata:
      labels:
        app: helphero-frontend
    spec:
      containers:
        - name: frontend
          image: ramtichkule/helphero-frontend:__IMAGE_TAG__
          ports:
            - containerPort: 80
