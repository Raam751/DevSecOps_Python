apiVersion: v1
kind: Service
metadata:
  name: helphero-backend
  namespace: helphero
spec:
  selector:
    app: helphero-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: helphero-frontend
  namespace: helphero
spec:
  selector:
    app: helphero-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
