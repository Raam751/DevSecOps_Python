frontend:
  image: ghcr.io/YOUR_ORG/helphero-frontend
  tag: latest
backend:
  image: ghcr.io/YOUR_ORG/helphero-backend
  tag: latest
replicaCount: 2
namespace: helphero
imagePullSecrets: []
postgres:
  host: helphero-postgres
  database: helphero
  username: helphero
  password: helphero
ingress:
  enabled: false
  host: helphero.local
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 500m, memory: 512Mi}
monitoring:
  serviceMonitor:
    enabled: true
