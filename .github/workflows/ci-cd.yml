name: HelpHero CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ========================================
# STEP 1 — Test
# ========================================
jobs:
  test:
    name: Test — Backend & Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Run backend tests
        run: pytest -v
        working-directory: backend

      - uses: actions/setup-node@v4
        with: {node-version: '22'}

      - name: Build frontend
        run: npm install && npm run build
        working-directory: frontend

  # ========================================
  # STEP 2 — Build Docker Images
  # ========================================
  docker-build:
    name: Docker Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-backend:${{ github.sha }} ./backend

      - name: Build frontend image
        run: docker build -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-frontend:${{ github.sha }} ./frontend

  # ========================================
  # STEP 3 — Scan Docker Images with Trivy
  # ========================================
  image-scan:
    name: Image Scan — Trivy
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild backend image for scan
        run: docker build -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-backend:${{ github.sha }} ./backend

      - name: Rebuild frontend image for scan
        run: docker build -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-frontend:${{ github.sha }} ./frontend

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/trivy.gpg
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Scan backend image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed \
            ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-backend:${{ github.sha }}

      - name: Scan frontend image
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed \
            ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-frontend:${{ github.sha }}

  # ========================================
  # STEP 4 — Push Images to GHCR
  # ========================================
  push:
    name: Push Images to GHCR
    needs: image-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag backend image
        run: |
          docker build \
            -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-backend:${{ github.sha }} \
            -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-backend:latest \
            ./backend

      - name: Build and tag frontend image
        run: |
          docker build \
            -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-frontend:${{ github.sha }} \
            -t ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-frontend:latest \
            ./frontend

      - name: Push backend image
        run: |
          docker push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-backend:${{ github.sha }}
          docker push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-backend:latest

      - name: Push frontend image
        run: |
          docker push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-frontend:${{ github.sha }}
          docker push ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helphero-frontend:latest

  # ========================================
  # STEP 5 — Deploy to Kubernetes (main only)
  # ========================================
  deploy:
    name: Deploy to Kubernetes
    needs: push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1.10.0

      - name: Build images for Kind
        run: |
          docker build -t helphero-backend:ci ./backend
          docker build -t helphero-frontend:ci ./frontend

      - name: Load images into Kind cluster
        run: |
          kind load docker-image helphero-backend:ci --name chart-testing
          kind load docker-image helphero-frontend:ci --name chart-testing

      - name: Create namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Patch deployment to use local CI images
        run: |
          sed -i "s|ghcr.io/__OWNER__/helphero-backend:__IMAGE_TAG__|helphero-backend:ci|g" k8s/deployment.yaml
          sed -i "s|ghcr.io/__OWNER__/helphero-frontend:__IMAGE_TAG__|helphero-frontend:ci|g" k8s/deployment.yaml
          sed -i "s|imagePullPolicy: Always|imagePullPolicy: Never|g" k8s/deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for backend pod to be ready
        run: |
          kubectl wait --for=condition=ready pod \
            -l app=helphero-backend \
            -n helphero \
            --timeout=180s
        continue-on-error: true

      - name: Debug pod state on failure
        run: |
          echo "=== Pods ==="
          kubectl get pods -n helphero -o wide
          echo "=== Describe backend pod ==="
          kubectl describe pod -l app=helphero-backend -n helphero
          echo "=== Backend pod logs ==="
          kubectl logs -l app=helphero-backend -n helphero --previous 2>/dev/null || true
          kubectl logs -l app=helphero-backend -n helphero 2>/dev/null || true
          echo "=== Events ==="
          kubectl get events -n helphero --sort-by=.lastTimestamp

      - name: Fail if pod not ready
        run: kubectl wait --for=condition=ready pod -l app=helphero-backend -n helphero --timeout=10s

      - name: Smoke test backend API
        run: |
          kubectl port-forward service/helphero-backend 8001:80 -n helphero &
          sleep 5
          echo "Health check..."
          curl -sf http://localhost:8001/health
          echo ""
          echo "Tickets API..."
          curl -sf http://localhost:8001/api/tickets